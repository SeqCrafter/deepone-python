name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in (version, f"v{version}"):
              raise SystemExit(f"Release tag {tag!r} must be {version!r} or 'v{version}'.")
          PY
      - name: Build and check source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build and test wheels
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish distributions to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    # Configure a PyPI Trusted Publisher for publish.yml and environment "pypi".
    environment:
      name: pypi
      url: https://pypi.org/p/DeepOneCalculator
    permissions:
      id-token: write
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: pypi-sdist
          path: dist/
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: manylinux-wheels
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
