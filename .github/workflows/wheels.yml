name: Manylinux wheels
on:
  workflow_dispatch:
  workflow_call:
jobs:
  manylinux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.2
      - uses: actions/upload-artifact@v4
        with:
          name: manylinux-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
