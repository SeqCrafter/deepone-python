name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: test
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install independent reference RNAfold
        shell: bash -el {0}
        run: conda install -y bioconda::viennarna=2.7.2
      - name: Build and test installed wheel
        shell: bash -el {0}
        env:
          DEEPONE_REQUIRE_RNAFOLD: '1'
          OMP_NUM_THREADS: '1'
          TF_NUM_INTRAOP_THREADS: '1'
          TF_NUM_INTEROP_THREADS: '1'
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          python -m pip install pytest ruff mypy pandas-stubs
          if [ "${{ matrix.python }}" != "3.10" ]; then
            python -m pip install "DeepOneCalculator[specificity]"
          fi
          ruff check .
          mypy
          pytest
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
